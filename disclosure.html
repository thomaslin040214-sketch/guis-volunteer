<script>
/* 文档自愈：托管服务器只给 last-modified，没有 Cache-Control / ETag，
   浏览器会启发式复用旧版 HTML —— 旧版里引用的还是旧版本号的 CSS/JS，
   于是点站内链接（全是裸路径）进去时整页退回旧设计。
   这里比对 <html data-ver>：不是当前版本就带查询串重拉一次（查询串必定回源）。 */
(function () {
  var VER = "20261102c";
  try {
    var el = document.documentElement;
    var healed = /[?&]_v=/.test(location.search);

    var seen = "";
    try { seen = localStorage.getItem("guis-doc-ver-seen") || ""; } catch (e) {}
    if (seen && seen > VER && !healed) {
      sessionStorage.setItem("guis-doc-ver", VER);
      var su = location.href.split("#")[0];
      location.replace(su + (su.indexOf("?") >= 0 ? "&" : "?") + "_v=" + VER + "&cb=" + Date.now() + (location.hash || ""));
      return;
    }
    try { if (VER > seen) localStorage.setItem("guis-doc-ver-seen", VER); } catch (e) {}

    if (el.getAttribute("data-ver") === VER) {
      if (healed && history.replaceState) {
        var q = location.search.replace(/[?&]_v=[^&]*/, "").replace(/[?&]cb=[^&]*/g, "").replace(/^\?&/, "?");
        history.replaceState(null, "", location.pathname + (q === "?" ? "" : q) + location.hash);
      }
      return;
    }
    if (healed) return;
    if (sessionStorage.getItem("guis-doc-ver") === VER) return;
    sessionStorage.setItem("guis-doc-ver", VER);
    var u = location.href.split("#")[0];
    location.replace(u + (u.indexOf("?") >= 0 ? "&" : "?") + "_v=" + VER + "&cb=" + Date.now() + (location.hash || ""));
  } catch (e) {}
})();
</script>
