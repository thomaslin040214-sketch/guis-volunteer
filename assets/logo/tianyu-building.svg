<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="presentation">
  <!-- ==========================================================================
       GUIS 明珠湾校区 · 主教学楼「天宇楼」—— 天圆地方
       ==========================================================================
       建筑原型（SOM 事务所设计，2024 年 8 月启用）：
       · 主体建筑总体布局呈圆形 —— 圆环形教学楼，中央留出内庭，
         俯视宛如一只飞碟 → 这是「天圆」
       · 坐落在方形的场地基座上，环体两轴（东北—西南 / 西北—东南）把
         西北侧入口广场与中央内庭、东南侧运动场串起来 → 这是「地方」
       · 六层，环体与屋顶交接处有一道活力红腰线
       · 校园主色：国际蓝 / 活力红 / 自然绿 / 温馨木

       本文件是背景水印用的平面化线稿（不是照片）：
       实心块用品牌蓝三阶（深→中→浅），基座只描边不填实 ——
       整块压在页面底部时，描边才不会被读成「一块蓝色斑」。

       ⚠️ XML 注释里不能出现连续两个连字符，否则浏览器按 XML 解析直接报错，
          图会裂开。下面的分隔线一律用等号。
       ========================================================================== -->

  <!-- 方形基座（地）：只描边，留出两条对角主轴 -->
  <path d="M380 318 L720 410 L380 502 L40 410 Z"
        fill="#144C90" fill-opacity="0.10"
        stroke="#144C90" stroke-width="3" stroke-linejoin="round" />

  <!-- 两条对角主轴：把四角的入口广场与环心内庭连起来 -->
  <g stroke="#144C90" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M40 410 L720 410" />
    <path d="M380 318 L380 502" />
  </g>

  <!-- 圆形环状楼身（天） -->
  <!-- 楼身正面：两道同半径椭圆弧夹出的圆筒面（后面被楼顶盖住） -->
  <path d="M92 248 A288 62 0 0 0 668 248 L668 316 A288 62 0 0 1 92 316 Z" fill="#2C68AC" />

  <!-- 楼层水平线（六层环体） -->
  <g stroke="#54B4D8" stroke-width="2.5" opacity="0.85" fill="none">
    <path d="M92 262 A288 62 0 0 0 668 262" />
    <path d="M92 278 A288 62 0 0 0 668 278" />
    <path d="M92 294 A288 62 0 0 0 668 294" />
  </g>

  <!-- 活力红腰线：环体与圆顶交接的那一圈 -->
  <path d="M92 310 A288 62 0 0 0 668 310 L668 318 A288 62 0 0 1 92 318 Z" fill="#9C2126" />

  <!-- 飞碟主盘（环体外缘，比屋顶大一圈 → 露出一圈檐口） -->
  <ellipse cx="380" cy="248" rx="288" ry="62" fill="#144C90" />

  <!-- 圆顶（天）：整块圆形屋面 -->
  <ellipse cx="380" cy="232" rx="232" ry="50" fill="#2C68AC" />

  <!-- 中央内庭：环心的天井，从屋面上挖空 -->
  <ellipse cx="380" cy="236" rx="82" ry="17" fill="#144C90" />
</svg>
