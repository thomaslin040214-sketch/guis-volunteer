<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="presentation">
  <!-- ==========================================================================
       GUIS 明珠湾校区 · 「天圆地方」背景水印（极简几何徽标，非建筑插画）
       ==========================================================================
       设计意图：
       · 天 = 圆形（红，品牌主色 #9C2126），象征「天圆」
       · 地 = 方形（蓝，国际蓝 #144C90），象征「地方」
       · 圆压在方上、略宽出方座两肩 —— 呼应天宇楼「圆环教学楼落在方形基座」，
         也呼应实景里「圆形天窗罩在方形中庭」的天圆地方构图
       · 圆内再开一圈浅蓝内圆（天井 / 中庭），给线稿一点 Logo 式的呼吸感
       · 纯描边、不填实：压在页脚做淡水印时不会被读成一坨色块

       ⚠️ XML 注释里不能出现连续两个连字符，否则浏览器按 XML 解析直接报错，
          图会裂开。下面的分隔线一律用等号。
       ========================================================================== -->

  <!-- 地：方形基座（只描边，不填实） -->
  <rect x="250" y="250" width="260" height="260" rx="6"
        fill="none" stroke="#144C90" stroke-width="8" stroke-linejoin="round" />

  <!-- 天：圆形屋面（品牌红描边，坐在方座上、左右各宽出方座一截） -->
  <circle cx="380" cy="150" r="150"
          fill="none" stroke="#9C2126" stroke-width="8" />

  <!-- 天井：圆内再开一圈浅蓝内圆（中庭 / 内庭的呼吸点） -->
  <circle cx="380" cy="150" r="58"
          fill="none" stroke="#2C68AC" stroke-width="4" />
</svg>
